<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATOA Live Status</title>
<style>
  :root {
    --bg: #1a1d29;
    --card: #232735;
    --border: #3a3f50;
    --text: #e0e3eb;
    --muted: #8a90a5;
    --up: #00d97e;
    --down: #ff5252;
    --warn: #ffb84d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 32px; max-width: 800px; margin: 0 auto; }
  .nav { display: flex; gap: 16px; margin-bottom: 24px; font-size: 14px; }
  .nav a { color: var(--muted); text-decoration: none; padding: 4px 0; }
  .nav a:hover { color: var(--up); }
  .nav a.active { color: var(--text); border-bottom: 2px solid var(--up); }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { border-color: var(--up); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .last-update { color: var(--muted); font-size: 13px; }
  .monitor { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .monitor-header { display: flex; justify-content: space-between; align-items: center; }
  .monitor-name { font-weight: 600; font-size: 16px; }
  .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
  .status-up { background: rgba(0, 217, 126, 0.15); color: var(--up); }
  .status-down { background: rgba(255, 82, 82, 0.15); color: var(--down); }
  .status-pending { background: rgba(255, 184, 77, 0.15); color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta span strong { color: var(--text); margin-left: 4px; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 32px; text-align: center; }
  .footer a { color: var(--up); text-decoration: none; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/status/">📊 7-day history</a>
  <a href="/status/live.html" class="active">⚡ Live ping</a>
</nav>

<h1>TATOA Live Status</h1>
<p class="subtitle">실시간 BE actuator/health 직접 호출. 새로고침 시 즉시 갱신.</p>

<div class="controls">
  <button id="refresh">🔄 새로고침</button>
  <label><input type="checkbox" id="auto" checked> 30초 자동 갱신</label>
  <span class="last-update" id="last-update">—</span>
</div>

<div id="monitors"></div>

<p class="footer">
  Live ping board · CORS 허용된 origin에서만 fetch 가능
</p>

<script>
const TARGETS = [
  { name: "BE Production",  url: "https://be-prd.tatoaweb.com/actuator/health",     env: "prd" },
  { name: "BE Staging",     url: "https://be-stg.tatoa-web-y.com/actuator/health",  env: "stg" },
  { name: "BE Development", url: "https://be-dev.tatoa-web-y.com/actuator/health",  env: "dev" },
];

const TIMEOUT_MS = 5000;

function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (props.className) e.className = props.className;
  children.forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return e;
}

async function probe(target) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  const t0 = performance.now();
  try {
    const res = await fetch(target.url, { signal: ctrl.signal, cache: "no-store" });
    const elapsed = Math.round(performance.now() - t0);
    return { ok: res.ok, status: res.status, elapsed, error: null };
  } catch (e) {
    const elapsed = Math.round(performance.now() - t0);
    return { ok: false, status: 0, elapsed, error: e.name === "AbortError" ? "timeout" : e.message };
  } finally {
    clearTimeout(timer);
  }
}

function renderMonitor(target, result) {
  const container = el("div", { className: "monitor" });
  const header = el("div", { className: "monitor-header" });
  header.appendChild(el("div", { className: "monitor-name", textContent: target.name }));

  let badgeClass, badgeText;
  if (result === "pending") {
    badgeClass = "status-pending";
    badgeText = "체크 중";
  } else if (result.ok) {
    badgeClass = "status-up";
    badgeText = "🟩 Up";
  } else {
    badgeClass = "status-down";
    badgeText = "🟥 Down";
  }
  header.appendChild(el("div", { className: `status-badge ${badgeClass}`, textContent: badgeText }));
  container.appendChild(header);

  const meta = el("div", { className: "meta" });
  if (result === "pending") {
    meta.appendChild(el("span", { textContent: "..." }));
  } else {
    const httpSpan = el("span"); httpSpan.innerHTML = `HTTP <strong>${result.status || "—"}</strong>`;
    meta.appendChild(httpSpan);
    const timeSpan = el("span"); timeSpan.innerHTML = `응답시간 <strong>${result.elapsed}ms</strong>`;
    meta.appendChild(timeSpan);
    const urlSpan = el("span"); urlSpan.innerHTML = `<strong>${target.env}</strong>`;
    meta.appendChild(urlSpan);
    if (result.error) {
      const errSpan = el("span"); errSpan.innerHTML = `오류 <strong>${result.error}</strong>`;
      meta.appendChild(errSpan);
    }
  }
  container.appendChild(meta);
  return container;
}

async function refresh() {
  const refreshBtn = document.getElementById("refresh");
  const lastUpdate = document.getElementById("last-update");
  refreshBtn.disabled = true;
  lastUpdate.textContent = "체크 중...";

  const container = document.getElementById("monitors");
  container.innerHTML = "";
  TARGETS.forEach(t => container.appendChild(renderMonitor(t, "pending")));

  const results = await Promise.all(TARGETS.map(probe));

  container.innerHTML = "";
  TARGETS.forEach((t, i) => container.appendChild(renderMonitor(t, results[i])));

  const now = new Date();
  lastUpdate.textContent = `마지막 갱신: ${now.toLocaleTimeString("ko-KR")}`;
  refreshBtn.disabled = false;
}

let autoTimer = null;
function setupAuto() {
  if (autoTimer) clearInterval(autoTimer);
  if (document.getElementById("auto").checked) {
    autoTimer = setInterval(refresh, 30000);
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("auto").addEventListener("change", setupAuto);
refresh();
setupAuto();
</script>

</body>
</html>
